name: MiMotion

on:
  schedule:
    # 北京时间 09:17 为主触发，其余为备用（GitHub 定时任务偶尔漏跑；当天已成功则自动跳过）
    - cron: '17 1 * * *'
    - cron: '47 2 * * *'
    - cron: '17 4 * * *'
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'dry_run'
        type: choice
        options:
          - check_config
          - dry_run
          - run

permissions:
  contents: write
  actions: read

concurrency:
  group: mimotion-run
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Skip if already succeeded today (Beijing time)
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, datetime
          repo = os.environ["REPO"]; cur = int(os.environ["RUN_ID"])
          bj = datetime.timezone(datetime.timedelta(hours=8))
          start = datetime.datetime.now(bj).replace(hour=0, minute=0, second=0, microsecond=0).astimezone(datetime.timezone.utc)
          since = start.strftime("%Y-%m-%dT%H:%M:%SZ")
          def api(path):
              return json.loads(subprocess.check_output(["gh", "api", path]))
          runs = api(f"repos/{repo}/actions/workflows/run.yml/runs?created=>={since}&per_page=50&status=success")["workflow_runs"]
          done = False
          for r in runs:
              if r["id"] == cur:
                  continue
              if r["event"] == "schedule":
                  done = True
              elif r["event"] == "workflow_dispatch":
                  jobs = api(f"repos/{repo}/actions/runs/{r['id']}/jobs")["jobs"]
                  for j in jobs:
                      for st in j.get("steps", []):
                          if st["name"] == "Persist encrypted tokens" and st["conclusion"] == "success":
                              done = True
              if done:
                  print("already succeeded today via run", r["id"], r["event"]); break
          open(os.environ["GITHUB_OUTPUT"], "a").write("skip=%s\n" % ("true" if done else "false"))
          PY

      - name: Random delay for scheduled runs
        if: github.event_name == 'schedule' && steps.check.outputs.skip != 'true'
        run: |
          max_minutes="${{ vars.RANDOM_DELAY_MINUTES }}"
          if [ -z "$max_minutes" ]; then
            max_minutes=50
          fi
          if [ "$max_minutes" -gt 0 ]; then
            delay_seconds=$(( RANDOM % (max_minutes * 60 + 1) ))
            echo "Scheduled run will wait ${delay_seconds}s before starting."
            sleep "$delay_seconds"
          else
            echo "Random delay disabled."
          fi

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: pip3 install -r requirements.txt

      - name: Check config
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check_config'
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
          ZEPP_USER: ${{ secrets.ZEPP_USER }}
          ZEPP_PASSWORD: ${{ secrets.ZEPP_PASSWORD }}
          MIN_STEP: ${{ vars.MIN_STEP }}
          MAX_STEP: ${{ vars.MAX_STEP }}
          STEP_MODE: ${{ vars.STEP_MODE }}
          FIXED_STEP: ${{ vars.FIXED_STEP }}
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          PUSH_PLUS_HOUR: ${{ vars.PUSH_PLUS_HOUR }}
          PUSH_PLUS_MAX: ${{ vars.PUSH_PLUS_MAX }}
          SLEEP_GAP: ${{ vars.SLEEP_GAP }}
          USE_CONCURRENT: ${{ vars.USE_CONCURRENT }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python3 main.py --check-config

      - name: Run MiMotion
        if: steps.check.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.mode != 'check_config')
        env:
          CONFIG: ${{ secrets.CONFIG }}
          AES_KEY: ${{ secrets.AES_KEY }}
          ZEPP_USER: ${{ secrets.ZEPP_USER }}
          ZEPP_PASSWORD: ${{ secrets.ZEPP_PASSWORD }}
          MIN_STEP: ${{ vars.MIN_STEP }}
          MAX_STEP: ${{ vars.MAX_STEP }}
          STEP_MODE: ${{ vars.STEP_MODE }}
          FIXED_STEP: ${{ vars.FIXED_STEP }}
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          PUSH_PLUS_HOUR: ${{ vars.PUSH_PLUS_HOUR }}
          PUSH_PLUS_MAX: ${{ vars.PUSH_PLUS_MAX }}
          SLEEP_GAP: ${{ vars.SLEEP_GAP }}
          USE_CONCURRENT: ${{ vars.USE_CONCURRENT }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          FORCE_DRY_RUN: ${{ inputs.mode == 'dry_run' && 'true' || '' }}
        run: python3 main.py

      - name: Persist encrypted tokens
        if: steps.check.outputs.skip != 'true' && (github.event_name == 'schedule' || inputs.mode == 'run')
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add encrypted_tokens.data
          if git diff --cached --quiet; then
            echo "No token changes to persist."
          else
            git commit -m "persist encrypted tokens"
            git push
          fi
